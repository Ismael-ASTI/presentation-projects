<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 640" role="img" aria-labelledby="title desc">
  <title id="title">Logo InfoCell</title>
  <desc id="desc">Logo circular da InfoCell com texto metalico</desc>
  <defs>
    <radialGradient id="disc" cx="50%" cy="35%" r="70%">
      <stop offset="0%" stop-color="#23262b"/>
      <stop offset="55%" stop-color="#111317"/>
      <stop offset="100%" stop-color="#07080a"/>
    </radialGradient>
    <linearGradient id="metal" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f5f7fa"/>
      <stop offset="45%" stop-color="#9fa7b4"/>
      <stop offset="65%" stop-color="#dfe4ec"/>
      <stop offset="100%" stop-color="#7d8796"/>
    </linearGradient>
    <filter id="softNoise" x="-20%" y="-20%" width="140%" height="140%">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" seed="7"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer>
        <feFuncA type="table" tableValues="0 0.05"/>
      </feComponentTransfer>
    </filter>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#000" flood-opacity="0.55"/>
    </filter>
  </defs>

  <g>
    <circle cx="320" cy="320" r="255" fill="url(#disc)"/>
    <circle cx="320" cy="320" r="255" fill="#fff" filter="url(#softNoise)"/>
    <circle cx="320" cy="320" r="254" fill="none" stroke="#4d5662" stroke-opacity="0.45"/>
  </g>

  <g text-anchor="middle" filter="url(#shadow)">
    <text x="320" y="265" fill="#9ba3af" font-family="Segoe UI, Arial, sans-serif" font-size="34" letter-spacing="5">
      ASSISTENCIA TECNICA
    </text>
    <text x="320" y="350" fill="url(#metal)" font-family="Arial Black, Segoe UI, sans-serif" font-size="98" letter-spacing="2">
      INFOCELL
    </text>
  </g>
</svg>
