# Netlify Configuration for BertzTech Landing
# https://docs.netlify.com/configure-builds/file-conventions/

[build]
# Build command - installs deps and builds the Vite app
command = "pnpm install && pnpm build"

# Directory to publish - Vite outputs to dist/
publish = "dist"

# Functions directory (for serverless functions if needed later)
functions = "netlify/functions"

# Node version
node_version = "20"

[build.environment]
# Force SKIP_ENV_VALIDATION if needed
SKIP_ENV_VALIDATION = "true"

# Redirect rules for client-side routing (SPA)
[[redirects]]
from = "/*"
to = "/index.html"
status = 200

# Cache headers for static assets
[[headers]]
for = "/assets/*"
[headers.values]
Cache-Control = "public, max-age=31536000, immutable"

# Cache headers for index.html (no caching for index since it's the entry point)
[[headers]]
for = "/index.html"
[headers.values]
Cache-Control = "public, max-age=0, must-revalidate"

# Security headers
[[headers]]
for = "/*"
[headers.values]
X-Content-Type-Options = "nosniff"
X-Frame-Options = "SAMEORIGIN"
X-XSS-Protection = "1; mode=block"
Referrer-Policy = "strict-origin-when-cross-origin"
Permissions-Policy = "geolocation=(self), microphone=()"
