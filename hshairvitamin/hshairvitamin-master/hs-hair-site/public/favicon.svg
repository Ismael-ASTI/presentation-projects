<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" role="img" aria-labelledby="title desc">
  <title id="title">HS Hair Icon</title>
  <desc id="desc">Icone floral da marca HS Hair em degrade rosa.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8a003f"/>
      <stop offset="1" stop-color="#f71a85"/>
    </linearGradient>
    <linearGradient id="petal" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff"/>
      <stop offset="1" stop-color="#ffd4e9"/>
    </linearGradient>
  </defs>
  <rect width="128" height="128" rx="30" fill="url(#bg)"/>
  <g transform="translate(64 64)">
    <circle r="6.5" fill="#fff"/>
    <ellipse rx="5.8" ry="18" fill="url(#petal)" transform="rotate(0) translate(0 -24)"/>
    <ellipse rx="5.8" ry="18" fill="url(#petal)" transform="rotate(72) translate(0 -24)"/>
    <ellipse rx="5.8" ry="18" fill="url(#petal)" transform="rotate(144) translate(0 -24)"/>
    <ellipse rx="5.8" ry="18" fill="url(#petal)" transform="rotate(216) translate(0 -24)"/>
    <ellipse rx="5.8" ry="18" fill="url(#petal)" transform="rotate(288) translate(0 -24)"/>
  </g>
  <text x="64" y="108" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="24" font-weight="700" fill="#fff" letter-spacing="1.8">HS</text>
</svg>
